[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-omop-trans"
version = "0.1.0"
description = "Review-only Simplified Chinese candidates for OMOP concepts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4.1,<2",
  "filelock>=3.20,<4",
  "httpx[socks]>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "openai>=2,<4",
  "pydantic>=2.12,<3",
]

[project.scripts]
llm-omop-trans = "llm_omop_trans.llm_trans:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_omop_trans"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
